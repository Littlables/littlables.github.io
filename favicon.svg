<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Natural Wood Gradients -->
    <linearGradient id="woodTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="woodFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="woodSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="newsPaperBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fcf9f2" />
      <stop offset="100%" stop-color="#f3ede1" />
    </linearGradient>
    <filter id="blockDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#090d16" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Canvas Border / Background Container -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#0b1120" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Background Newspaper Article Sheet -->
  <rect x="8" y="8" width="112" height="112" rx="20" fill="url(#newsPaperBg)" stroke="#d97706" stroke-width="1.2"/>

  <!-- Newspaper Header / Masthead -->
  <rect x="14" y="14" width="100" height="11" rx="2" fill="#1e293b"/>
  <text x="64" y="22" font-family="Georgia, serif, sans-serif" font-size="6.5" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">DAILY CURRENTS</text>
  <line x1="14" y1="28" x2="114" y2="28" stroke="#64748b" stroke-width="0.8"/>
  <text x="16" y="27" font-family="sans-serif" font-size="3.2" fill="#64748b" font-weight="bold">VOL. 1</text>
  <text x="112" y="27" font-family="sans-serif" font-size="3.2" fill="#64748b" text-anchor="end" font-weight="bold">OCTOBER 2026</text>

  <!-- Background Article Columns (Left & Right margins) -->
  <!-- Left Column News Lines -->
  <line x1="14" y1="34" x2="36" y2="34" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="14" y1="38" x2="34" y2="38" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="14" y1="42" x2="36" y2="42" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="14" y1="46" x2="32" y2="46" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="14" y1="50" x2="36" y2="50" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="14" y1="54" x2="30" y2="54" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="14" y1="58" x2="36" y2="58" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="14" y1="62" x2="28" y2="62" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="14" y1="66" x2="26" y2="66" stroke="#cbd5e1" stroke-width="0.9"/>

  <!-- Right Column News Lines -->
  <line x1="92" y1="34" x2="114" y2="34" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="94" y1="38" x2="114" y2="38" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="92" y1="42" x2="114" y2="42" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="96" y1="46" x2="114" y2="46" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="92" y1="50" x2="114" y2="50" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="94" y1="54" x2="114" y2="54" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="92" y1="58" x2="114" y2="58" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="96" y1="62" x2="114" y2="62" stroke="#cbd5e1" stroke-width="0.9"/>

  <!-- Column Divider Rule Lines -->
  <line x1="39" y1="30" x2="39" y2="70" stroke="#e2e8f0" stroke-width="0.8"/>
  <line x1="89" y1="30" x2="89" y2="70" stroke="#e2e8f0" stroke-width="0.8"/>

  <!-- Shadow Under Wooden Pyramid -->
  <ellipse cx="64" cy="112" rx="46" ry="7" fill="#090d16" opacity="0.45"/>

  <!-- ========================================================
       PYRAMID BLOCK 1 (BOTTOM-LEFT): Lowercase 'i'
       Top symbol: 🐾 Pet Paw | Side symbol: 🤖 AI Robot
       ======================================================== -->
  <g filter="url(#blockDrop)">
    <!-- Top Face -->
    <polygon points="26,74 40,65 72,65 58,74" fill="url(#woodTop)" stroke="#b45309" stroke-width="1"/>
    <!-- Top Symbol: 🐾 Cute Paw Print -->
    <ellipse cx="49" cy="69" rx="3" ry="2.2" fill="#ec4899"/>
    <circle cx="45.5" cy="67" r="1.1" fill="#ec4899"/>
    <circle cx="49" cy="66" r="1.1" fill="#ec4899"/>
    <circle cx="52.5" cy="67" r="1.1" fill="#ec4899"/>

    <!-- Right Side Face -->
    <polygon points="58,74 72,65 72,97 58,106" fill="url(#woodSide)" stroke="#78350f" stroke-width="1"/>
    <!-- Side Symbol: 🤖 AI Robot Face -->
    <rect x="61" y="78" width="8" height="7" rx="1.5" fill="#f8fafc" stroke="#1e293b" stroke-width="0.8"/>
    <circle cx="63.5" cy="80.5" r="1" fill="#3b82f6"/>
    <circle cx="66.5" cy="80.5" r="1" fill="#3b82f6"/>
    <line x1="63" y1="83" x2="67" y2="83" stroke="#1e293b" stroke-width="0.6"/>

    <!-- Front Face (Wooden Bezel) -->
    <rect x="26" y="74" width="32" height="32" rx="2" fill="url(#woodFront)" stroke="#b45309" stroke-width="1.2"/>
    <!-- Inset Newspaper Clipping on Front Face -->
    <rect x="29" y="77" width="26" height="26" rx="1.5" fill="url(#newsPaperBg)" stroke="#d97706" stroke-width="0.8"/>
    <!-- Newspaper lines on block -->
    <line x1="31" y1="80" x2="53" y2="80" stroke="#1e293b" stroke-width="1"/>
    <line x1="31" y1="83" x2="53" y2="83" stroke="#94a3b8" stroke-width="0.7"/>

    <!-- Lowercase 'i' (Cobalt Blue with cute dot) -->
    <circle cx="42" cy="88" r="2.4" fill="#2563eb"/>
    <circle cx="41.2" cy="87.2" r="0.8" fill="#ffffff" opacity="0.8"/>
    <rect x="40" y="92" width="4" height="9" rx="1" fill="#2563eb"/>
    <line x1="40.8" y1="93" x2="40.8" y2="100" stroke="#93c5fd" stroke-width="0.8"/>
  </g>

  <!-- ========================================================
       PYRAMID BLOCK 2 (BOTTOM-RIGHT): Uppercase 'L'
       Top symbol: 🎨 Palette | Side symbol: 🌍 Globe
       ======================================================== -->
  <g filter="url(#blockDrop)">
    <!-- Top Face -->
    <polygon points="66,74 80,65 112,65 98,74" fill="url(#woodTop)" stroke="#b45309" stroke-width="1"/>
    <!-- Top Symbol: 🎨 Arts Palette -->
    <ellipse cx="89" cy="69" rx="4.5" ry="3" fill="#f8fafc" stroke="#d97706" stroke-width="0.8"/>
    <circle cx="87" cy="68" r="0.9" fill="#ec4899"/>
    <circle cx="89" cy="67.5" r="0.9" fill="#eab308"/>
    <circle cx="91" cy="68" r="0.9" fill="#10b981"/>

    <!-- Right Side Face -->
    <polygon points="98,74 112,65 112,97 98,106" fill="url(#woodSide)" stroke="#78350f" stroke-width="1"/>
    <!-- Side Symbol: 🌍 Globe -->
    <circle cx="105" cy="82" r="4.2" fill="#38bdf8" stroke="#0284c7" stroke-width="0.8"/>
    <path d="M 103 80 Q 106 81 107 83 Q 104 85 103 84 Z" fill="#22c55e"/>

    <!-- Front Face (Wooden Bezel) -->
    <rect x="66" y="74" width="32" height="32" rx="2" fill="url(#woodFront)" stroke="#b45309" stroke-width="1.2"/>
    <!-- Inset Newspaper Clipping on Front Face -->
    <rect x="69" y="77" width="26" height="26" rx="1.5" fill="url(#newsPaperBg)" stroke="#d97706" stroke-width="0.8"/>
    <!-- Newspaper lines on block -->
    <line x1="71" y1="80" x2="93" y2="80" stroke="#1e293b" stroke-width="1"/>
    <line x1="71" y1="83" x2="93" y2="83" stroke="#94a3b8" stroke-width="0.7"/>

    <!-- Uppercase 'L' (Emerald Green) -->
    <polygon points="78,86 82,86 82,97 90,97 90,100 78,100" fill="#059669"/>
    <line x1="78.8" y1="87" x2="78.8" y2="99" stroke="#6ee7b7" stroke-width="0.8"/>
    <line x1="79" y1="99.2" x2="89.2" y2="99.2" stroke="#6ee7b7" stroke-width="0.8"/>
  </g>

  <!-- ========================================================
       PYRAMID BLOCK 3 (APEX - TOP CENTER): Uppercase 'L'
       Perched centrally on top of Block 1 and Block 2!
       Top symbol: ⚡ Breaking Bolt | Side symbol: 🚀 Rocket
       ======================================================== -->
  <g filter="url(#blockDrop)">
    <!-- Top Face -->
    <polygon points="46,45 60,36 92,36 78,45" fill="url(#woodTop)" stroke="#b45309" stroke-width="1"/>
    <!-- Top Symbol: ⚡ Breaking News Lightning Bolt -->
    <polygon points="69,38 65,41 68,41 67,44 71,40 68,40" fill="#eab308" stroke="#ca8a04" stroke-width="0.6"/>

    <!-- Right Side Face -->
    <polygon points="78,45 92,36 92,68 78,77" fill="url(#woodSide)" stroke="#78350f" stroke-width="1"/>
    <!-- Side Symbol: 🚀 Space Rocket -->
    <polygon points="85,50 88,58 82,58" fill="#f8fafc" stroke="#dc2626" stroke-width="0.8"/>
    <polygon points="85,58 87,62 83,62" fill="#f97316"/>

    <!-- Front Face (Wooden Bezel) -->
    <rect x="46" y="45" width="32" height="32" rx="2" fill="url(#woodFront)" stroke="#b45309" stroke-width="1.2"/>
    <!-- Inset Newspaper Clipping on Front Face -->
    <rect x="49" y="48" width="26" height="26" rx="1.5" fill="url(#newsPaperBg)" stroke="#d97706" stroke-width="0.8"/>
    <!-- Newspaper lines on block -->
    <line x1="51" y1="51" x2="73" y2="51" stroke="#1e293b" stroke-width="1"/>
    <line x1="51" y1="54" x2="73" y2="54" stroke="#94a3b8" stroke-width="0.7"/>

    <!-- Uppercase 'L' (Bright Cherry Red) -->
    <polygon points="58,57 62,57 62,68 70,68 70,71 58,71" fill="#e11d48"/>
    <line x1="58.8" y1="58" x2="58.8" y2="70" stroke="#fda4af" stroke-width="0.8"/>
    <line x1="59" y1="70.2" x2="69.2" y2="70.2" stroke="#fda4af" stroke-width="0.8"/>
  </g>

  <!-- Sweet Sparkles in Playroom -->
  <path d="M 108 14 Q 108 19 113 19 Q 108 19 108 24 Q 108 19 103 19 Q 108 19 108 14 Z" fill="#facc15"/>
  <circle cx="108" cy="19" r="1.2" fill="#ffffff"/>
  <path d="M 18 20 Q 18 23 21 23 Q 18 23 18 26 Q 18 23 15 23 Q 18 23 18 20 Z" fill="#f472b6" opacity="0.9"/>
</svg>