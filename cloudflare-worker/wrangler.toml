name = "hello-ai"
main = "src/index.js"
compatibility_date = "2025-01-01"

[ai]
binding = "AI"

[[unsafe.bindings]]
name = "SUMMARY_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[triggers]
# 0 * * * * = hourly provider sync.
# 10 * * * * = post-ingest interest tag pass (tag-pass code handles this
# pattern first, so it never runs a sync). Keep the tag-pass code deployed
# alongside this trigger.
crons = ["0 * * * *", "10 * * * *"]
