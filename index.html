  <style>
    /* =========================================================
       PULSE-BITE NEWS FEED STYLES (Drop into your <style> or CSS)
       ========================================================= */
    :root {
      --news-bg: #0f172a;
      --news-card-bg: #1e293b;
      --news-card-border: rgba(255, 255, 255, 0.08);
      --news-text: #f8fafc;
      --news-text-muted: #94a3b8;
      --news-accent: #6366f1;
      --news-ai-bg: rgba(99, 102, 241, 0.12);
      --news-ai-border: #818cf8;
      --news-tag-bg: #ec4899;
    }

    .news-widget-wrapper {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, sans-serif;
      color: var(--news-text);
    }

    .news-widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .news-widget-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .news-card {
      background: var(--news-card-bg);
      border: 1px solid var(--news-card-border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .news-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.2);
    }

    .news-card-image-wrap {
      width: 100%;
      height: 190px;
      background: #334155;
      position: relative;
      overflow: hidden;
    }

    .news-card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .news-card:hover .news-card-image {
      transform: scale(1.05);
    }

    .news-card-badge {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      background: var(--news-tag-bg);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .news-card-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 0.75rem;
    }

    .news-card-meta {
      font-size: 0.75rem;
      color: var(--news-text-muted);
      display: flex;
      justify-content: space-between;
    }

    .news-card-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.35;
      color: #fff;
      text-decoration: none;
    }

    .news-card-title:hover {
      color: #a5b4fc;
    }

    .news-card-desc {
      font-size: 0.85rem;
      color: var(--news-text-muted);
      line-height: 1.5;
      flex: 1;
    }

    /* AI Summary Callout Box */
    .news-card-ai-summary {
      background: var(--news-ai-bg);
      border-left: 3px solid var(--news-ai-border);
      border-radius: 0 8px 8px 0;
      padding: 0.65rem 0.85rem;
      font-size: 0.8rem;
      line-height: 1.45;
      color: #e0e7ff;
    }

    .news-card-ai-label {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #c7d2fe;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .news-card-footer {
      margin-top: auto;
      padding-top: 0.5rem;
    }

    .news-read-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--news-accent);
      text-decoration: none;
      transition: color 0.15s;
    }

    .news-read-more-btn:hover {
      color: #a5b4fc;
    }

    /* Loading state */
    .news-loading-skeleton {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--news-text-muted);
      font-size: 0.95rem;
    }
  </style>

    /**
     * Detects user language & region from browser settings.
     */
    function getDetectedLocale() {
      const rawLocale = navigator.language || (navigator.languages && navigator.languages[0]) || 'en-US';
      let lang = 'en';
      let region = 'US';

      try {
        const locale = new Intl.Locale(rawLocale);
        lang = locale.language || 'en';
        region = locale.region || '';
      } catch (err) {
        const parts = rawLocale.split('-');
        lang = parts[0] || 'en';
        region = parts[1] || '';
      }

      if (!region) {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
        if (tz.startsWith('America/')) region = 'US';
        else if (tz.startsWith('Europe/London')) region = 'GB';
        else if (tz.startsWith('Europe/Paris')) region = 'FR';
        else if (tz.startsWith('Europe/Berlin')) region = 'DE';
        else if (tz.startsWith('Asia/Tokyo')) region = 'JP';
        else if (tz.startsWith('Canada/')) region = 'CA';
        else if (tz.startsWith('Australia/')) region = 'AU';
        else region = 'US';
      }

      return {
        lang: lang.toLowerCase(),
        region: region.toUpperCase(),
        fullCode: `${lang.toLowerCase()}-${region.toUpperCase()}`
      };
    }

    /**
     * Resolves translation string by key, falling back to English if needed.
     */
    function t(key) {
      const { lang } = getDetectedLocale();
      const currentDictionary = I18N_TRANSLATIONS[lang] || I18N_TRANSLATIONS.en;
      return currentDictionary[key] || I18N_TRANSLATIONS.en[key] || '';
    }

    /**
     * Applies static translations to existing HTML elements immediately.
     */
    function applyStaticUiTranslations() {
      const { lang } = getDetectedLocale();
      document.documentElement.lang = lang;
      document.title = t('pageTitle');

      const titleEl = document.getElementById('widget-title-text');
      if (titleEl) titleEl.textContent = t('headerTitle');

      const refreshBtn = document.getElementById('refresh-news-btn');
      if (refreshBtn) refreshBtn.textContent = t('refreshBtn');

      const loadingEl = document.getElementById('news-loading-text');
      if (loadingEl) loadingEl.textContent = t('loading');
    }

    /**
     * Formats Google News RSS parameters: "&hl=xx-XX&gl=XX&ceid=XX:xx"
     */
    function getGoogleNewsParams() {
      const { lang, region, fullCode } = getDetectedLocale();
      return `hl=${fullCode}&gl=${region}&ceid=${region}:${lang}`;
    }

    /**
     * Builds the complete CORS-friendly RSS-to-JSON endpoint URL
     */
    function getDynamicNewsFeedUrl() {
      const params = getGoogleNewsParams();
      const rawRssUrl = `https://news.google.com/rss?${params}`;
      return `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rawRssUrl)}`;
    }

    /**
     * CONFIGURATION
     */
    const NEWS_CONFIG = {
      get feedUrl() { return getDynamicNewsFeedUrl(); },
      get defaultCategory() { return t('breaking'); },
      maxStories: 9,
      fallbackImages: [
        'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=600&auto=format&fit=crop',
        'https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&auto=format&fit=crop',
        'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600&auto=format&fit=crop',
        'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=600&auto=format&fit=crop'
      ]
    };

    /**
     * Helper to clean HTML tags from raw descriptions
     */
    function stripHtml(html) {
      const doc = new DOMParser().parseFromString(html || '', 'text/html');
      return doc.body.textContent || '';
    }

    /**
     * AI Summarizer Logic:
     * Fully localized to the reader's detected language.
     */
    function generateAiSummary(title, rawDescription) {
      const cleanText = stripHtml(rawDescription);
      const sentences = cleanText.split(/(?<=[.?!])\s+/).filter(s => s.trim().length > 15);
      const mainSubject = title.split(' - ')[0].trim();

      if (sentences.length > 0) {
        return `${t('aiTakeaway')} ${sentences[0]} ${t('aiHighlight')} ${mainSubject}.`;
      }
      return `${t('aiTakeaway')} ${t('aiDeveloping')} ${mainSubject}. ${t('aiDevelopingSuffix')}`;
    }

    /**
     * Extract or generate an image URL for the article
     */
    function resolveImageUrl(item, index) {
      if (item.thumbnail && item.thumbnail.startsWith('http')) return item.thumbnail;
      if (item.enclosure && item.enclosure.link) return item.enclosure.link;

      if (item.description) {
        const match = item.description.match(/<img[^>]+src=["']([^"']+)["']/i);
        if (match && match[1]) return match[1];
      }

      return NEWS_CONFIG.fallbackImages[index % NEWS_CONFIG.fallbackImages.length];
    }

    /**
     * Fetch stories from API and display on the static page
     */
    async function loadCurrentEvents() {
      applyStaticUiTranslations();
      const container = document.getElementById('news-grid-container');
      container.innerHTML = `<div class="news-loading-skeleton">${t('loading')}</div>`;

      try {
        const response = await fetch(NEWS_CONFIG.feedUrl);
        const data = await response.json();

        if (!data.items || data.items.length === 0) {
          throw new Error('No stories returned from endpoint');
        }

        const itemsToDisplay = data.items
          .sort(() => Math.random() - 0.5)
          .slice(0, NEWS_CONFIG.maxStories);

        container.innerHTML = '';

        itemsToDisplay.forEach((item, index) => {
          const title = item.title || 'Untitled Update';
          const cleanDesc = stripHtml(item.description).slice(0, 160) + '...';
          const imageUrl = resolveImageUrl(item, index);
          const aiSummary = generateAiSummary(title, item.description);
          const pubDate = item.pubDate ? new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : t('recent');
          const link = item.link || '#';

          // Create the card element
          const card = document.createElement('article');
          card.className = 'news-card';
          card.innerHTML = `
            <div class="news-card-image-wrap">
              <img src="${imageUrl}" alt="${title}" class="news-card-image" loading="lazy" onerror="this.src='${NEWS_CONFIG.fallbackImages[0]}'">
              <span class="news-card-badge">${t('breaking')}</span>
            </div>
            <div class="news-card-content">
              <div class="news-card-meta">
                <span>🕒 ${pubDate}</span>
                <span>${t('verifiedWire')}</span>
              </div>
              <a href="${link}" target="_blank" rel="noopener noreferrer" class="news-card-title">${title}</a>
              <p class="news-card-desc">${cleanDesc}</p>
              
              <!-- AI Summary Block -->
              <div class="news-card-ai-summary">
                <div class="news-card-ai-label">${t('aiBriefTag')}</div>
                <div>${aiSummary}</div>
              </div>

              <div class="news-card-footer">
                <a href="${link}" target="_blank" rel="noopener noreferrer" class="news-read-more-btn">
                  ${t('readMore')}
                </a>
              </div>
            </div>
          `;

          container.appendChild(card);
        });

      } catch (err) {
        console.error('Error fetching news:', err);
        renderFallbackStories(container);
      }
    }

    /**
     * Fallback renderer if offline or API limit reached
     */
    function renderFallbackStories(container) {
      const demoStories = [
        {
          title: "Deep Space Observatory Telemetry Detects Repeating Galactic Rhythms",
          desc: "Astronomers logged periodic radio pulses from a distant galaxy, triggering coordinated multi-spectral telescope observation passes.",
          ai: `${t('aiTakeaway')} Periodic electromagnetic emissions indicate high-energy magnetar activity rather than random noise.`,
          img: NEWS_CONFIG.fallbackImages[2],
          time: `12m ${t('recent').toLowerCase()}`
        },
        {
          title: "Photonic Edge Silicon Delivers Ultra-Low Power Neural Processing",
          desc: "Hardware researchers validate optical waveguide chips operating at room temperature without conventional electrical resistance bottlenecks.",
          ai: `${t('aiTakeaway')} Substantial efficiency leap for mobile and decentralized consumer edge computing applications.`,
          img: NEWS_CONFIG.fallbackImages[1],
          time: `25m ${t('recent').toLowerCase()}`
        },
        {
          title: "Companion Animal Longevity Trials Highlight Nutrition Milestones",
          desc: "Canine veterinary research panels validate natural antioxidant blends and gentle whole-food additions for joint and vitality support.",
          ai: `${t('aiTakeaway')} Gentle antioxidant-dense whole foods provide measurable preventative mobility benefits over time.`,
          img: NEWS_CONFIG.fallbackImages[0],
          time: `1h ${t('recent').toLowerCase()}`
        }
      ];

      container.innerHTML = '';
      demoStories.forEach(s => {
        const card = document.createElement('article');
        card.className = 'news-card';
        card.innerHTML = `
          <div class="news-card-image-wrap">
            <img src="${s.img}" class="news-card-image" alt="${s.title}">
            <span class="news-card-badge">${t('trending')}</span>
          </div>
          <div class="news-card-content">
            <div class="news-card-meta">
              <span>🕒 ${s.time}</span>
              <span>${t('liveFeed')}</span>
            </div>
            <a href="#" class="news-card-title">${s.title}</a>
            <p class="news-card-desc">${s.desc}</p>
            <div class="news-card-ai-summary">
              <div class="news-card-ai-label">${t('aiBriefTag')}</div>
              <div>${s.ai}</div>
            </div>
            <div class="news-card-footer">
              <a href="#" class="news-read-more-btn">${t('readMore')}</a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Attach refresh button listener & run on page load
    document.getElementById('refresh-news-btn').addEventListener('click', loadCurrentEvents);
    document.addEventListener('DOMContentLoaded', loadCurrentEvents);
  </script>
