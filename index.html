  <script>
    // Early theme initialization to prevent any theme flash (FOUC), with device system mode detection
    (function() {
      try {
        var saved = localStorage.getItem('selected_theme');
        var allowed = ['dark', 'dark-purple', 'light', 'rainbow', 'pastel-rainbow', 'pink'];
        if (saved && allowed.indexOf(saved) !== -1) {
          document.documentElement.setAttribute('data-theme', saved);
        } else {
          var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
        }
      } catch (e) {}
    })();
  </script>

  <script type="module">
    // Hybrid module loader:
    // If running under Vite dev server (port 3000 or ais-dev host), load source /src/main.tsx
    // If running on GitHub Pages (github.io) or any static host, directly load compiled ./assets/bundle.js
    const isViteDev = window.location.port === '3000' ||
      window.location.hostname.includes('ais-dev') ||
      window.location.hostname.includes('ais-pre');

    if (isViteDev) {
      import('/src/main.tsx').catch(() => import('./assets/bundle.js'));
    } else {
      import('./assets/bundle.js');
    }
  </script>
