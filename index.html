<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-adsense-account" content="ca-pub-6117076538261387">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192x192.png">
  <script>
    // Early theme initialization to prevent any theme flash (FOUC), with device system mode detection
    (function() {
      try {
        var saved = localStorage.getItem('selected_theme');
        var allowed = ['dark', 'dark-purple', 'light', 'rainbow', 'pastel-rainbow', 'pink'];
        if (saved && allowed.indexOf(saved) !== -1) {
          document.documentElement.setAttribute('data-theme', saved);
        } else {
          // Detect device dark/light mode as default
          var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="shortcut icon" href="favicon.ico">
  <title id="page-title">Littlables</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- HTML CONTAINER -->
  <div class="news-widget-wrapper">
    <div class="news-widget-header">
      <div class="news-widget-title" id="widget-main-title">
        <span>⚡</span> <span id="widget-title-text">Littlables Feed</span>
      </div>
      <div class="news-header-controls">
        <div class="theme-picker-container" title="Select Theme">
          <span class="theme-select-icon" aria-hidden="true">🎨</span>
          <select id="theme-select" class="theme-dropdown-select" aria-label="Select Theme">
            <option value="dark">🌙 Dark Mode</option>
            <option value="dark-purple">🔮 Dark Purple</option>
            <option value="light">☀️ Light Mode</option>
            <option value="rainbow">🌈 Rainbow</option>
            <option value="pastel-rainbow">🦄 Pastel Rainbow</option>
            <option value="pink">💖 Pretty Pink</option>
          </select>
        </div>
        <button id="refresh-news-btn" class="refresh-news-button" title="Refresh Stories">
          🔄 Refresh Feed
        </button>
      </div>
    </div>

    <!-- Category Pill Navigation Bar (Mini Quest 1) -->
    <nav class="news-category-bar" id="news-category-bar">
      <button class="cat-pill active" data-category="all">
        <span>⚡</span> <span class="cat-text" data-i18n="catAll">Top Currents</span>
      </button>
      <button class="cat-pill" data-category="animals">
        <span>🐾</span> <span class="cat-text" data-i18n="catAnimals">Animals & Nature</span>
      </button>
      <button class="cat-pill" data-category="tech">
        <span>🤖</span> <span class="cat-text" data-i18n="catTech">Future Tech & AI</span>
      </button>
      <button class="cat-pill" data-category="arts">
        <span>🎨</span> <span class="cat-text" data-i18n="catArts">Creative Arts</span>
      </button>
      <button class="cat-pill" data-category="world">
        <span>🌍</span> <span class="cat-text" data-i18n="catWorld">Global Currents</span>
      </button>
      <button class="cat-pill" data-category="uplifting">
        <span>✨</span> <span class="cat-text" data-i18n="catUplifting">Uplifting News</span>
      </button>
    </nav>

    <!-- The cards get injected into this element -->
    <div id="news-grid-container" class="news-grid">
      <div class="news-loading-skeleton" id="news-loading-text">Fetching the freshest stories & computing AI summaries...</div>
    </div>
  </div>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6117076538261387"
     crossorigin="anonymous"></script>

  <script src="i18n.js"></script>
  <script src="supabase.js"></script>
  <script src="theme.js"></script>
  <script src="ai.js"></script>
  <script src="cards.js"></script>
  <script src="fallback.js"></script>
  <script src="app.js"></script>
</body>
</html>
