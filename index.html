  <script>
    // Early theme initialization to prevent any theme flash (FOUC)
    (function() {
      try {
        var saved = localStorage.getItem('selected_theme');
        var allowed = ['dark', 'dark-purple', 'light', 'rainbow', 'pastel-rainbow', 'pink'];
        if (saved && allowed.indexOf(saved) !== -1) {
          document.documentElement.setAttribute('data-theme', saved);
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>

    /**
     * Detects user language & region from browser settings.
     */
    function getDetectedLocale() {
      const rawLocale = navigator.language || (navigator.languages && navigator.languages[0]) || 'en-US';
      let lang = 'en';
      let region = 'US';

      try {
        const locale = new Intl.Locale(rawLocale);
        lang = locale.language || 'en';
        region = locale.region || '';
      } catch (err) {
        const parts = rawLocale.split('-');
        lang = parts[0] || 'en';
        region = parts[1] || '';
      }

      if (!region) {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
        if (tz === 'Asia/Kolkata' || tz === 'Asia/Calcutta') region = 'IN';
        else if (tz.startsWith('America/')) region = 'US';
        else if (tz.startsWith('Europe/London')) region = 'GB';
        else if (tz.startsWith('Europe/Paris')) region = 'FR';
        else if (tz.startsWith('Europe/Berlin')) region = 'DE';
        else if (tz.startsWith('Asia/Tokyo')) region = 'JP';
        else if (tz.startsWith('Asia/Seoul')) region = 'KR';
        else if (tz.startsWith('Asia/Shanghai') || tz.startsWith('Asia/Chongqing')) region = 'CN';
        else if (tz.startsWith('Asia/Taipei')) region = 'TW';
        else if (tz.startsWith('Canada/')) region = 'CA';
        else if (tz.startsWith('Australia/')) region = 'AU';
        else if (tz.startsWith('America/Sao_Paulo')) region = 'BR';
        else region = (lang === 'mr' || lang === 'hi' || lang === 'bn' || lang === 'ta' || lang === 'te') ? 'IN' : 'US';
      }

      return {
        lang: lang.toLowerCase(),
        region: region.toUpperCase(),
        fullCode: `${lang.toLowerCase()}-${region.toUpperCase()}`
      };
    }

    /**

    function t(key) {
      const { lang, fullCode } = getDetectedLocale();
      const currentDictionary =

        I18N_TRANSLATIONS[lang] ||
        I18N_TRANSLATIONS.en;
      return currentDictionary[key] || I18N_TRANSLATIONS.en[key] || '';
    }

    /**
     * Extract or generate an image URL for the article based on its topic category
     */
    function resolveImageUrl(item, index, categoryKey = currentCategory) {
      if (item.thumbnail && item.thumbnail.startsWith('http')) return item.thumbnail;
      if (item.enclosure && item.enclosure.link) return item.enclosure.link;

      if (item.description) {
        const match = item.description.match(/<img[^>]+src=["']([^"']+)["']/i);
        if (match && match[1] && match[1].startsWith('http')) return match[1];
      }

      const pool = CATEGORY_STOCK_IMAGES[categoryKey] || CATEGORY_STOCK_IMAGES.all;
      return pool[index % pool.length];
    }

    /**
     * Creates a stable, deterministic ID from story title and link
     */
    function getStoryId(title, link) {
      const str = ((link || '') + (title || '')).toLowerCase().trim();
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return 's_' + Math.abs(hash).toString(36).slice(0, 10);
    }

    /**

    function getReactionCount(storyId, type, seedBase) {
      const key = `rec_${storyId}_${type}`;
      const stored = localStorage.getItem(key);
      if (stored !== null) return parseInt(stored, 10);
      const seed = Math.floor(Math.abs(seedBase * 7 + (type === 'love' ? 14 : type === 'mind' ? 9 : 21)) % 38) + 4;
      localStorage.setItem(key, seed);
      return seed;
    }

        console.warn("Supabase fetch notice:", err);

    }

    /**
     * Handles reaction button click:
     * - Immediate optimistic UI feedback (bounce & local count)
     * - Calls atomic Postgres RPC functions (increment_reaction / decrement_reaction)
     * - Database governs the true count, preventing unauthorized tampering!
     */
    async function handleReaction(btn, storyId, type) {
      btn.classList.add('pop-bounce');
      setTimeout(() => btn.classList.remove('pop-bounce'), 450);

      const countEl = btn.querySelector('.reaction-count');
      const localCount = parseInt(countEl.textContent, 10) || 0;
      const alreadyVoted = hasUserReacted(storyId, type);

      if (alreadyVoted) {
        // Toggle off (decrement)
        btn.classList.remove('voted');
        localStorage.removeItem(`voted_${storyId}_${type}`);
        countEl.textContent = Math.max(0, localCount - 1);

        if (supabaseClient) {
          try {
            const { data: dbCount, error } = await supabaseClient.rpc('decrement_reaction', {
              p_story_id: storyId,
              p_reaction_type: type
            });
            if (error || typeof dbCount !== 'number') {
              throw error || new Error('Invalid response from RPC');
            }
            countEl.textContent = dbCount;
            localStorage.setItem(`rec_${storyId}_${type}`, dbCount);
          } catch (err) {
            console.warn("RPC decrement notice:", err);
            // Roll back optimistic changes if RPC fails
            btn.classList.add('voted');
            localStorage.setItem(`voted_${storyId}_${type}`, 'true');
            countEl.textContent = localCount;
          }
        }
      } else {
        // Toggle on (increment)
        btn.classList.add('voted');
        localStorage.setItem(`voted_${storyId}_${type}`, 'true');
        countEl.textContent = localCount + 1;

        if (supabaseClient) {
          try {
            const { data: dbCount, error } = await supabaseClient.rpc('increment_reaction', {
              p_story_id: storyId,
              p_reaction_type: type
            });
            if (error || typeof dbCount !== 'number') {
              throw error || new Error('Invalid response from RPC');
            }
            countEl.textContent = dbCount;
            localStorage.setItem(`rec_${storyId}_${type}`, dbCount);
          } catch (err) {
            console.warn("RPC increment notice:", err);
            // Roll back optimistic changes if RPC fails
            btn.classList.remove('voted');
            localStorage.removeItem(`voted_${storyId}_${type}`);
            countEl.textContent = localCount;
          }
        }
      }
    }

    async function loadCurrentEvents() {
      applyStaticUiTranslations();
      const container = document.getElementById('news-grid-container');
      container.innerHTML = `<div class="news-loading-skeleton">${t('loading')}</div>`;

      try {
        const targetUrl = getDynamicNewsFeedUrl(currentCategory);
        const response = await fetch(targetUrl);
        const data = await response.json();

        if (!data.items || data.items.length === 0) {
          throw new Error('No stories returned from endpoint');
        }

        const itemsToDisplay = data.items
          .sort(() => Math.random() - 0.5)
          .slice(0, NEWS_CONFIG.maxStories);

        container.innerHTML = '';
        const categoryBadge = getActiveCategoryBadge();

        itemsToDisplay.forEach((item, index) => {
          const title = item.title || 'Untitled Update';
          const cleanDesc = item.description;
          const imageUrl = resolveImageUrl(item, index, currentCategory);
          const fallbackImg = getCategoryFallbackImage(currentCategory, index);
          const aiSummary = generateAiSummary(title, item.description);
          const pubDate = item.pubDate ? new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : t('recent');
          const link = item.link || '#';

          // Mini Quest 3: Interactive Reactions & Unique Story ID
          const storyId = getStoryId(title, link);
          const loveCount = getReactionCount(storyId, 'love', index + 1);
          const mindCount = getReactionCount(storyId, 'mind', index + 2);
          const cozyCount = getReactionCount(storyId, 'cozy', index + 3);
          const votedLove = hasUserReacted(storyId, 'love');
          const votedMind = hasUserReacted(storyId, 'mind');
          const votedCozy = hasUserReacted(storyId, 'cozy');

          // Create the card element
          const card = document.createElement('article');
          card.className = 'news-card';
          card.innerHTML = `
            <div class="news-card-image-wrap">
              <img src="${imageUrl}" alt="${title}" class="news-card-image" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImg}';">
              <span class="news-card-badge">${categoryBadge}</span>
            </div>
            <div class="news-card-content">
              <div class="news-card-meta">
                <span>🕒 ${pubDate}</span>
                <span>${t('verifiedWire')}</span>
              </div>
              <a href="${link}" target="_blank" rel="noopener noreferrer" class="news-card-title">${title}</a>
              <p class="news-card-desc">${cleanDesc}</p>
              
              <!-- AI Summary Block -->
              <div class="news-card-ai-summary">
                <div class="news-card-ai-label">${t('aiBriefTag')}</div>
                <div>${aiSummary}</div>
              </div>

              <div class="news-card-footer">
                <a href="${link}" target="_blank" rel="noopener noreferrer" class="news-read-more-btn">
                  ${t('readMore')}
                </a>
                <div class="news-card-reactions">
                  <button class="reaction-pill ${votedLove ? 'voted' : ''}" onclick="handleReaction(this, '${storyId}', 'love')" title="Love it">
                    <span>❤️</span> <span class="reaction-count" data-story="${storyId}" data-type="love">${loveCount}</span>
                  </button>
                  <button class="reaction-pill ${votedMind ? 'voted' : ''}" onclick="handleReaction(this, '${storyId}', 'mind')" title="Mind Blown">
                    <span>🤯</span> <span class="reaction-count" data-story="${storyId}" data-type="mind">${mindCount}</span>
                  </button>
                  <button class="reaction-pill ${votedCozy ? 'voted' : ''}" onclick="handleReaction(this, '${storyId}', 'cozy')" title="Cozy">
                    <span>🧸</span> <span class="reaction-count" data-story="${storyId}" data-type="cozy">${cozyCount}</span>
                  </button>
                </div>
              </div>
            </div>
          `;

          container.appendChild(card);

          // Mini Quest 2: Insert In-Feed Native Ad after 3rd and 6th story
          if (index === 2 || index === 5) {
            container.appendChild(createInFeedAdCard(Math.floor(index / 3)));
          }
        });

        // Fetch live database counts from Supabase
        const displayedStoryIds = itemsToDisplay.map((item, idx) => getStoryId(item.title, item.link));
        syncReactionsFromSupabase(displayedStoryIds);

      } catch (err) {
        console.error('Error fetching news:', err);
        renderFallbackStories(container);
      }
    }

    function restoreCategoryPills() {
      const targetPill = document.querySelector(`.cat-pill[data-category="${currentCategory}"]`);
      if (targetPill) {
        document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
        targetPill.classList.add('active');
      }
    }

    // Attach Category Pill click listeners (Mini Quest 1 & persistence)
    document.querySelectorAll('.cat-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-category');
        try {
          localStorage.setItem(SAVED_CATEGORY_KEY, currentCategory);
        } catch (e) {
          console.warn('Could not save category to localStorage:', e);
        }
        loadCurrentEvents();
      });
    });

    restoreCategoryPills();

    /**
     * =========================================================
     * THEME MANAGER (Mini Quest: 6 Visual Themes & Profile Ready)
     * =========================================================
     * Manages visual theme selection, local storage persistence, and provides
     * a clean integration hook for upcoming Supabase User Auth & Profiles.
     */
    const THEME_CONFIG = {
      storageKey: 'selected_theme',
      defaultTheme: 'dark',
      availableThemes: [
        { id: 'dark', name: 'Dark Mode', icon: '🌙' },
        { id: 'dark-purple', name: 'Dark Purple', icon: '🔮' },
        { id: 'light', name: 'Light Mode', icon: '☀️' },
        { id: 'rainbow', name: 'Rainbow', icon: '🌈' },
        { id: 'pastel-rainbow', name: 'Pastel Rainbow', icon: '🦄' },
        { id: 'pink', name: 'Pretty Pink', icon: '💖' }
      ]
    };

    const ThemeManager = {
      getSavedTheme() {
        try {
          const saved = localStorage.getItem(THEME_CONFIG.storageKey);
          if (saved && THEME_CONFIG.availableThemes.some(t => t.id === saved)) {
            return saved;
          }
        } catch (e) {
          console.warn("Theme storage read notice:", e);
        }
        return THEME_CONFIG.defaultTheme;
      },

      setTheme(themeId, syncToProfile = true) {
        if (!THEME_CONFIG.availableThemes.some(t => t.id === themeId)) {
          themeId = THEME_CONFIG.defaultTheme;
        }

        document.documentElement.setAttribute('data-theme', themeId);
        try {
          localStorage.setItem(THEME_CONFIG.storageKey, themeId);
        } catch (e) {
          console.warn("Theme storage save notice:", e);
        }

        const selectEl = document.getElementById('theme-select');
        if (selectEl && selectEl.value !== themeId) {
          selectEl.value = themeId;
        }

        // Future Profile / Auth sync hook
        if (syncToProfile && typeof syncThemeToUserProfile === 'function') {
          syncThemeToUserProfile(themeId);
        }
      },

      init() {
        const theme = this.getSavedTheme();
        this.setTheme(theme, false);

        const selectEl = document.getElementById('theme-select');
        if (selectEl) {
          selectEl.value = theme;
          selectEl.addEventListener('change', (e) => {
            this.setTheme(e.target.value, true);
          });
        }
      }
    };

    /**
     * Profile sync hook: When user auth and profiles are enabled,
     * this will persist the theme preference to the user's account in Supabase.
     */
    async function syncThemeToUserProfile(themeId) {
      if (typeof supabaseClient !== 'undefined' && supabaseClient && supabaseClient.auth) {
        try {
          const { data } = await supabaseClient.auth.getUser();
          if (data && data.user) {
            await supabaseClient
              .from('user_profiles')
              .upsert({ user_id: data.user.id, preferred_theme: themeId, updated_at: new Date().toISOString() });
          }
        } catch (err) {
          console.warn("User profile theme sync notice:", err);
        }
      }
    }

    ThemeManager.init();

    // Attach refresh button listener & run on page load
    document.getElementById('refresh-news-btn').addEventListener('click', loadCurrentEvents);
    document.addEventListener('DOMContentLoaded', () => {
      ThemeManager.init();
      restoreCategoryPills();
      loadCurrentEvents();
    });
  </script>
